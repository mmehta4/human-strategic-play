{% extends "base.html" %}
{% block title %}{{ t("withdraw.title") }} · {{ t("site.name") }}{% endblock %}
{% block body %}
<h1>{{ t("withdraw.title") }}</h1>
{% if has_data %}
<div class="card">
  <p>{{ t("withdraw.body") }}</p>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <button class="btn" type="submit">{{ t("withdraw.confirm") }}</button>
    <a class="btn secondary" href="{{ url_for('index') }}">{{ t("withdraw.keep") }}</a>
  </form>
</div>
{% else %}
<p>{{ t("withdraw.none") }}</p>
{% endif %}
{% endblock %}
